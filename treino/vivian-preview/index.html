<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #08080a; --surface: #111114; --surface-2: #19191d; --surface-3: #222226;
      --border: rgba(255,255,255,0.06); --border-light: rgba(255,255,255,0.1);
      --text: #ededef; --text-dim: #b0b0b6; --text-muted: #6b6b73;
      --accent-lift: #f59e0b; --accent-lift-dim: rgba(245,158,11,0.1); --accent-lift-glow: rgba(245,158,11,0.3); --accent-lift-strong: rgba(245,158,11,0.18);
      --accent-warmup: #fb7185; --accent-warmup-dim: rgba(251,113,133,0.1); --accent-warmup-glow: rgba(251,113,133,0.3);
      --accent-track: #f59e0b; --accent-track-dim: rgba(245,158,11,0.1); --accent-track-glow: rgba(245,158,11,0.3);
      --accent-soltura: #a78bfa; --accent-soltura-dim: rgba(167,139,250,0.1); --accent-soltura-glow: rgba(167,139,250,0.3);
      --accent-cardio: #22d3ee; --accent-cardio-dim: rgba(34,211,238,0.08); --accent-cardio-glow: rgba(34,211,238,0.25);
      --green: #34d399; --green-dim: rgba(52,211,153,0.1); --green-glow: rgba(52,211,153,0.3);
      --radius: 16px; --radius-sm: 10px;
      --font-display: 'Outfit', sans-serif; --font-body: 'DM Sans', sans-serif;
    }
    body { font-family: var(--font-body); background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100dvh; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
    body::after { content: ''; position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.025; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); background-size: 128px 128px; }
    body::before { content: ''; position: fixed; top: -120px; left: 50%; transform: translateX(-50%); width: 600px; height: 300px; background: radial-gradient(ellipse, rgba(245,158,11,0.06) 0%, transparent 70%); pointer-events: none; z-index: 0; }
    .container { max-width: 480px; margin: 0 auto; padding: 0 20px 120px; position: relative; z-index: 1; }
    .sticky-header { position: sticky; top: 0; z-index: 100; background: rgba(8,8,10,0.82); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); padding: 20px 0 16px; border-bottom: 1px solid var(--border); }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .brand { font-family: var(--font-display); font-size: 16px; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; background: linear-gradient(135deg, var(--accent-lift), #fbbf24); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .header-date { font-size: 11px; color: var(--text-muted); font-weight: 500; }
    .header-title { font-family: var(--font-display); font-size: 24px; font-weight: 800; letter-spacing: -0.8px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
    .header-title .athlete { color: var(--text); }
    .header-title .separator { color: var(--text-muted); margin: 0 4px; font-weight: 400; }
    .header-title .day { color: var(--text-dim); font-weight: 500; font-size: 20px; }
    .profile-badge { display: inline-block; font-family: var(--font-display); font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; background: var(--accent-track-dim); color: var(--accent-track); border: 1px solid rgba(245,158,11,0.15); margin-left: 6px; vertical-align: middle; }
    .progress-bar-container { display: flex; align-items: center; gap: 12px; }
    .progress-track { flex: 1; height: 5px; background: var(--surface-2); border-radius: 100px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 100px; background: linear-gradient(90deg, var(--accent-track), var(--green)); transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); width: 0%; position: relative; }
    .progress-label { font-family: var(--font-display); font-size: 13px; font-weight: 700; color: var(--text-muted); white-space: nowrap; min-width: 36px; text-align: right; }
    .template-banner { margin-top: 14px; padding: 12px 14px; background: rgba(245,158,11,0.08); border: 1px dashed rgba(245,158,11,0.4); border-radius: var(--radius); font-size: 12px; line-height: 1.5; color: var(--text-dim); }
    .template-banner strong { color: var(--accent-lift); }
    .mix-goal { margin-top: 16px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); position: relative; overflow: hidden; }
    .mix-goal::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent-track), var(--accent-cardio)); }
    .mix-goal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .mix-goal-label { font-family: var(--font-display); font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }
    .mix-goal-badge { font-family: var(--font-display); font-size: 9px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; background: var(--accent-track-dim); color: var(--accent-track); border: 1px solid rgba(245,158,11,0.08); }
    .mix-goal-items { display: flex; flex-direction: column; gap: 8px; }
    .mix-goal-item { display: flex; align-items: center; gap: 10px; }
    .mix-goal-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; background: var(--accent-track-dim); }
    .mix-goal-text { flex: 1; font-size: 13px; font-weight: 500; color: var(--text-dim); line-height: 1.3; }
    .mix-goal-text strong { color: var(--text); font-weight: 700; }
    .day-switcher { display: flex; gap: 6px; padding: 20px 0 12px; overflow-x: auto; scrollbar-width: none; }
    .day-switcher::-webkit-scrollbar { display: none; }
    .day-btn { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 6px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-muted); font-family: var(--font-body); font-size: 10px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; cursor: pointer; transition: all 0.2s; -webkit-appearance: none; position: relative; overflow: hidden; }
    .day-btn .day-num { font-family: var(--font-display); font-size: 18px; font-weight: 800; color: var(--text-dim); position: relative; }
    .day-btn.active { background: var(--surface-2); border-color: rgba(245,158,11,0.3); color: var(--accent-track); box-shadow: 0 0 24px rgba(245,158,11,0.08), inset 0 1px 0 rgba(245,158,11,0.1); }
    .day-btn.active .day-num { color: var(--accent-track); }
    .day-btn.rest { opacity: 0.3; cursor: default; }
    .day-btn.completed-day::after { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green-glow); margin-top: 2px; }
    .block { margin-top: 28px; }
    .initial-load .block { animation: blockReveal 0.5s cubic-bezier(0.4, 0, 0.2, 1) both; }
    .initial-load .block:nth-child(2) { animation-delay: 0.08s; }
    .initial-load .block:nth-child(3) { animation-delay: 0.16s; }
    .initial-load .block:nth-child(4) { animation-delay: 0.24s; }
    .initial-load .block:nth-child(5) { animation-delay: 0.32s; }
    .initial-load .block:nth-child(6) { animation-delay: 0.40s; }
    .initial-load .block:nth-child(7) { animation-delay: 0.48s; }
    @keyframes blockReveal { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .block-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .block-info { display: flex; align-items: center; gap: 10px; }
    .block-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .block--warmup .block-dot { background: var(--accent-warmup); box-shadow: 0 0 10px var(--accent-warmup-glow); }
    .block--forca .block-dot { background: var(--accent-track); box-shadow: 0 0 10px var(--accent-track-glow); }
    .block--cardio .block-dot { background: var(--accent-cardio); box-shadow: 0 0 10px var(--accent-cardio-glow); }
    .block--soltura .block-dot { background: var(--accent-soltura); box-shadow: 0 0 10px var(--accent-soltura-glow); }
    .block-name { font-family: var(--font-display); font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    .block--warmup .block-name { color: var(--accent-warmup); }
    .block--forca .block-name { color: var(--accent-track); }
    .block--cardio .block-name { color: var(--accent-cardio); }
    .block--soltura .block-name { color: var(--accent-soltura); }
    .block-progress { font-family: var(--font-display); font-size: 11px; font-weight: 700; color: var(--text-muted); background: var(--surface-2); padding: 5px 12px; border-radius: 100px; letter-spacing: 0.5px; transition: all 0.3s; }
    .block-progress.done { background: var(--green-dim); color: var(--green); box-shadow: 0 0 12px rgba(52,211,153,0.15); }
    .track { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; transition: all 0.25s; }
    .track.completed { border-color: rgba(52,211,153,0.12); background: linear-gradient(135deg, var(--surface) 0%, rgba(52,211,153,0.03) 100%); }
    .track-main { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; -webkit-user-select: none; user-select: none; }
    .check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--border-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); cursor: pointer; }
    .check:active { transform: scale(0.85); }
    .check svg { width: 14px; height: 14px; stroke: transparent; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; transition: all 0.25s; }
    .track.completed .check { background: var(--green); border-color: var(--green); box-shadow: 0 0 16px var(--green-glow); }
    .track.completed .check svg { stroke: #fff; }
    .track-content { flex: 1; min-width: 0; }
    .track-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .track-name { font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: -0.2px; color: var(--text); }
    .track.completed .track-name { opacity: 0.4; text-decoration: line-through; text-decoration-color: rgba(52,211,153,0.3); }
    .track-duration { font-family: var(--font-display); font-size: 11px; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
    .track-tags { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
    .tag { font-size: 9px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; }
    .tag--warmup { background: var(--accent-warmup-dim); color: var(--accent-warmup); }
    .tag--forca { background: var(--accent-track-dim); color: var(--accent-track); }
    .tag--cardio { background: var(--accent-cardio-dim); color: var(--accent-cardio); }
    .tag--soltura { background: var(--accent-soltura-dim); color: var(--accent-soltura); }
    .tag--track { background: rgba(245,158,11,0.06); color: #fbbf24; }
    .expand-chevron { width: 18px; height: 18px; flex-shrink: 0; color: var(--text-muted); transition: all 0.3s; opacity: 0.5; }
    .track.expanded .expand-chevron { transform: rotate(180deg); opacity: 0.8; }
    .track-detail { max-height: 0; overflow: hidden; transition: max-height 0.25s ease; }
    .track.expanded .track-detail { max-height: 320px; }
    .track-detail > .detail-inner { overflow: hidden; }
    .detail-inner { padding: 0 16px 16px; padding-left: 58px; display: flex; flex-direction: column; gap: 10px; }
    .track-play { display: flex; align-items: center; justify-content: center; gap: 8px; width: calc(100% - 32px); margin: 0 16px 14px; padding: 12px; border-radius: var(--radius-sm); background: linear-gradient(135deg, var(--accent-track), #fbbf24); color: #000; font-family: var(--font-display); font-size: 13px; font-weight: 800; letter-spacing: 0.3px; border: none; cursor: pointer; -webkit-appearance: none; transition: transform 0.15s; }
    .track-play:active { transform: scale(0.98); }
    .load-row { display: flex; align-items: center; gap: 8px; }
    .load-label { color: var(--text-muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; flex: 1; }
    .load-input { width: 72px; padding: 6px 10px; background: var(--surface-2); border: 1px solid var(--border-light); border-radius: 8px; color: var(--text); font-family: var(--font-display); font-size: 14px; font-weight: 700; text-align: center; outline: none; transition: border-color 0.2s; -webkit-appearance: none; }
    .load-input:focus { border-color: var(--accent-track); box-shadow: 0 0 0 2px var(--accent-track-dim); }
    .load-input::placeholder { color: var(--text-muted); font-weight: 400; font-size: 12px; }
    .load-unit { color: var(--text-muted); font-size: 12px; font-weight: 500; }
    .detail-row { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
    .detail-label { color: var(--text-muted); font-weight: 500; white-space: nowrap; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    .detail-value { color: var(--text-dim); font-weight: 400; font-size: 13px; }
    .rest-message { text-align: center; padding: 80px 20px; }
    .rest-message h2 { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .rest-message p { color: var(--text-muted); font-size: 14px; }
    .session-complete { display: none; text-align: center; padding: 36px 24px; margin-top: 28px; background: linear-gradient(135deg, rgba(52,211,153,0.06) 0%, rgba(52,211,153,0.02) 100%); border: 1px solid rgba(52,211,153,0.15); border-radius: var(--radius); }
    .session-complete.visible { display: block; animation: completeReveal 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes completeReveal { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .session-complete h3 { font-family: var(--font-display); font-size: 20px; font-weight: 800; color: var(--green); margin-bottom: 6px; }
    .session-complete p { font-size: 13px; color: var(--text-muted); }
    .finish-btn { display: none; width: 100%; padding: 14px; margin-top: 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text-dim); font-family: var(--font-display); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .finish-btn.show { display: block; }
    .finish-btn.finished { background: rgba(52,211,153,0.08); border-color: var(--green); color: var(--green); }
    .skipped-list { margin-top: 8px; font-size: 12px; color: var(--text-muted); text-align: left; }
    .skipped-list span { color: var(--accent-track); }
    .footer { text-align: center; margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 11px; line-height: 1.8; }
    .timer-bar { display: none; align-items: center; justify-content: space-between; padding: 14px 20px; background: rgba(52,211,153,0.06); border: 1px solid rgba(52,211,153,0.15); border-radius: var(--radius); margin-top: 8px; }
    .timer-bar.active { display: flex; }
    .timer-display { font-family: var(--font-display); font-size: 24px; font-weight: 800; color: var(--green); letter-spacing: 1px; }
    .timer-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--green); opacity: 0.7; }
    .timer-pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--green); animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }
    .start-btn, .stop-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; width: 100%; border: none; border-radius: var(--radius); font-family: var(--font-display); font-size: 14px; font-weight: 700; letter-spacing: 0.5px; cursor: pointer; transition: all 0.2s; -webkit-appearance: none; }
    .start-btn { background: linear-gradient(135deg, var(--green), #2dd4a8); color: #000; margin-top: 16px; }
    .start-btn:active { transform: scale(0.98); }
    .start-btn.hidden { display: none; }
    .stop-btn { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; margin-top: 8px; }
    .stop-btn:active { transform: scale(0.98); }
    .stop-btn.hidden { display: none; }
    .video-overlay { display: none; position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,0.92); backdrop-filter: blur(8px); align-items: center; justify-content: center; padding: 20px; }
    .video-overlay.active { display: flex; }
    .video-overlay iframe, .video-overlay video { width: 360px; height: 640px; max-width: 100%; max-height: 80vh; border-radius: 12px; border: none; background:#000; }
    .video-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.1); border: none; color: white; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
      /* dias flexíveis (06/10/2026) */
    .day-btn.rest { opacity: 0.45; cursor: pointer; }
    .day-btn.rest .day-num { color: var(--text-muted); }
    .day-btn.moved::before { opacity: 0.5; }
    .day-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 2px 0 14px; }
    .day-actions select, .day-actions button { font-family: var(--font-body); font-size: 12px; font-weight: 600; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border-light); background: var(--surface); color: var(--text); cursor: pointer; }
    .day-actions select { -webkit-appearance: none; appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%); background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
    .day-actions button.primary { background: var(--accent-lift); color: #000; border-color: transparent; }
    .day-actions .hint { width: 100%; font-size: 11px; color: var(--text-muted); }
    .rest-message .day-actions { justify-content: center; margin-top: 18px; }
</style>
</head>
<body>
<div class="container">
  <div class="sticky-header">
    <div class="header-top">
      <div class="brand">MaxResults</div>
      <div class="header-date" id="headerDate"></div>
    </div>
    <div class="header-title">
      <div><span class="athlete">Vivian</span><span class="profile-badge">Mix · Ciclo 1</span><span class="separator">/</span><span class="day" id="headerDay"></span></div>
    </div>
    <div class="progress-bar-container">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">0%</div>
    </div>
  </div>
  <div class="mix-goal" id="mixGoal"></div>
  <nav class="day-switcher" id="daySwitcher"></nav>
  <button class="start-btn" id="startBtn" onclick="startSession()">▶ Iniciar Treino</button>
  <div class="timer-bar" id="timerBar">
    <div><div class="timer-label">Tempo de Treino</div><div class="timer-display" id="timerDisplay">00:00</div></div>
    <div class="timer-pulse"></div>
  </div>
  <button class="stop-btn hidden" id="stopBtn" onclick="stopSession()">⏹ Finalizar Sessão</button>
  <main id="workoutContent" class="initial-load"></main>
  <div class="session-complete" id="sessionComplete">
    <h3>Treino concluído! 💪</h3>
    <p>Mandou bem, Vivian! Água, respira fundo e descansa.</p>
  </div>
  <button class="finish-btn" id="finishBtn" onclick="finishWorkout()">✅ Finalizar Treino</button>
  <div id="skippedInfo"></div>
  <footer class="footer">Metodologia MaxResults &middot; Luisão Ribeiro<br>Ciclo 1 &middot; 06/10/2026 &middot; próxima avaliação ~06/01/2027</footer>
</div>
<div class="video-overlay" id="videoOverlay" onclick="closeVideo()">
  <button class="video-close" onclick="closeVideo()">✕</button>
  <iframe id="bunnyPlayer" allow="autoplay; fullscreen" allowfullscreen></iframe>
  <video id="mp4Player" controls playsinline style="display:none"></video>
</div>
<script>
const ATHLETE = 'Vivian';

/* ═══════════════════════════════════════════════════════════════════════
   MIX / METAS DA SEMANA (Regra 18 — rodízio quinzenal de mixes)
   ═══════════════════════════════════════════════════════════════════════ */

function getMonday(d) {
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = dt.getDate() - day + (day === 0 ? -6 : 1);
  return new Date(dt.setDate(diff));
}
function pad(n) { return n < 10 ? '0' + n : '' + n; }

const ALL_DAYS = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const TRAIN_DAYS = ['Seg', 'Qua', 'Sex'];

function buildSchedule() {
  let k = 0;
  return ALL_DAYS.map(day => {
    if (TRAIN_DAYS.includes(day) && k < TRAINING_SLOTS.length) { const sl = TRAINING_SLOTS[k++]; return { dayName: day, rest: false, label: sl.label, blocks: sl.blocks }; }
    return { dayName: day, rest: true, label: 'Descanso' };
  });
}

function buildWeek() {
  const monday = getMonday(new Date());
  return buildSchedule().map((s, i) => {
    const dt = new Date(monday);
    dt.setDate(monday.getDate() + i);
    const dateStr = dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
    const entry = { day: s.dayName, date: dateStr, num: dt.getDate(), rest: s.rest, label: s.label };
    if (s.blocks) entry.tracks = s.blocks;
    return entry;
  });
}

let WEEK_SCHEDULE = buildSchedule();
let WEEK = buildWeek();

function getWeekKey() {
  const m = getMonday(new Date());
  return m.getFullYear() + '-' + pad(m.getMonth() + 1) + '-' + pad(m.getDate());
}

const SLUG = 'vivian';
const STORAGE_KEY = 'maxresults-' + SLUG + '-' + getWeekKey() + '-v1';

function loadProgress() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { return {}; } }
function saveProgress() { localStorage.setItem(STORAGE_KEY, JSON.stringify(completedTracks)); }
function trackKey(di, ti) { return `${di}-${ti}`; }

function findCurrentDay() {
  const today = new Date().toISOString().split('T')[0];
  const todayIdx = WEEK.findIndex(d => d.date === today);
  if (todayIdx !== -1) return todayIdx;
  for (let i = 0; i < WEEK.length; i++) { if (WEEK[i].date >= today && !WEEK[i].rest) return i; }
  return WEEK.findIndex(d => !d.rest);
}

function render() { renderMixGoal(); renderDaySwitcher(); renderWorkout(); updateProgress(); updateFinishButton(); restoreLoads(); }

}

function renderDaySwitcher() {
  document.getElementById('daySwitcher').innerHTML = WEEK.map((d, i) => {
    const cl = ['day-btn']; if (i === currentDayIndex) cl.push('active'); if (d.rest) cl.push('rest');

    return `<button class="${cl.join(' ')}" ${d.rest ? 'disabled' : ''} onclick="selectDay(${i})">${d.day}<span class="day-num">${d.num}</span></button>`;
  }).join('');
}

          <div class="check" onclick="event.stopPropagation(); toggleTrack('${key}')"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
          <div class="track-content">
            <div class="track-top"><span class="track-name">${trk.title}</span><span class="track-duration">${trk.duration}</span></div>
            <div class="track-tags"><span class="tag tag--${trk.role}">${trk.tag}</span><span class="tag tag--track">🎬 Track</span></div>
          </div>
          <svg class="expand-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
        <button class="track-play" onclick="event.stopPropagation(); playVideo('${trk.bunny}')">▶ Assistir o track</button>
        <div class="track-detail"><div class="detail-inner">
          ${loadsHtml}
          <div class="detail-row"><span class="detail-label">Como fazer:</span><span class="detail-value">${trk.tip}</span></div>
        </div></div>
      </div>
    </section>`;
  }).join('');
}

/* Player — Bunny (track, iframe embed) OU MFit (exercício, mp4). */
function playVideo(url) {
  const overlay = document.getElementById('videoOverlay');
  const player = document.getElementById('bunnyPlayer');
  const vid = document.getElementById('mp4Player');
  if (url.includes('mediadelivery.net')) {
    player.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'autoplay=true';
    player.style.display = ''; if (vid) { vid.style.display = 'none'; vid.pause(); }
  } else {
    if (vid) { vid.src = url; vid.style.display = ''; vid.play().catch(()=>{}); }
    player.style.display = 'none'; player.src = '';
  }
  overlay.classList.add('active');
}
function closeVideo() {
  document.getElementById('bunnyPlayer').src = '';
  const v=document.getElementById('mp4Player'); if(v){v.pause(); v.src='';}
  document.getElementById('videoOverlay').classList.remove('active');
}

function updateProgress() {
  const day = WEEK[currentDayIndex];
  if (day.rest) { document.getElementById('progressFill').style.width = '0%'; document.getElementById('progressLabel').textContent = '—'; return; }
  const total = day.tracks.length;
  const done = day.tracks.filter((_, ti) => completedTracks[trackKey(currentDayIndex, ti)]).length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = pct + '%';
  const complete = document.getElementById('sessionComplete');
  pct === 100 ? complete.classList.add('visible') : complete.classList.remove('visible');
}

function isDayComplete(di) {
  const d = WEEK[di]; if (d.rest || !d.tracks) return false;
  return d.tracks.every((_, ti) => completedTracks[trackKey(di, ti)]);
}

function selectDay(i) { if (WEEK[i].rest) return; currentDayIndex = i; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

function toggleTrack(key) {
  completedTracks[key] ? delete completedTracks[key] : completedTracks[key] = true;
  saveProgress();
  const el = document.getElementById('trk-' + key);
  if (el) el.classList.toggle('completed', !!completedTracks[key]);
  const badge = el ? el.closest('.block').querySelector('.block-progress') : null;
  if (badge) { badge.textContent = completedTracks[key] ? '1/1' : '0/1'; badge.classList.toggle('done', !!completedTracks[key]); }
  updateProgress(); updateFinishButton(); renderDaySwitcher();
}

function toggleDetail(key) { document.getElementById('trk-' + key).classList.toggle('expanded'); }

/* ─── Finalizar Treino (parcial) ─── */
function loadFinished() { try { return JSON.parse(localStorage.getItem(FINISH_KEY) || '{}'); } catch { return {}; } }

function finishWorkout() {
  const day = WEEK[currentDayIndex];
  if (day.rest) return;
  const finished = loadFinished();
  const skipped = [];
  day.tracks.forEach((trk, ti) => { if (!completedTracks[trackKey(currentDayIndex, ti)]) skipped.push(trk.title); });
  finished[day.date] = { completed: true, partial: skipped.length > 0, skipped, timestamp: new Date().toISOString() };
  localStorage.setItem(FINISH_KEY, JSON.stringify(finished));
  const btn = document.getElementById('finishBtn');
  btn.classList.add('finished'); btn.textContent = '✅ Treino Finalizado!'; btn.disabled = true;
  const info = document.getElementById('skippedInfo');
  info.innerHTML = skipped.length > 0
    ? `<div class="skipped-list">⚠️ Blocos pulados: <span>${skipped.join(', ')}</span></div>`
    : `<div class="skipped-list" style="color:var(--green)">✅ Todos os blocos concluídos!</div>`;
  renderDaySwitcher();
}

function isWorkoutFinished(di) {
  const d = WEEK[di]; if (!d || d.rest) return false;
  return loadFinished()[d.date]?.completed || false;
}

function updateFinishButton() {
  const day = WEEK[currentDayIndex];
  const btn = document.getElementById('finishBtn');
  const info = document.getElementById('skippedInfo');
  if (day.rest) { btn.classList.remove('show'); info.innerHTML = ''; return; }
  const finished = loadFinished();
  const alreadyFinished = finished[day.date]?.completed;
  const allDone = isDayComplete(currentDayIndex);
  if (allDone) { btn.classList.remove('show'); info.innerHTML = ''; }
  else if (alreadyFinished) {
    btn.classList.add('show', 'finished'); btn.textContent = '✅ Treino Finalizado!'; btn.disabled = true;
    const skipped = finished[day.date]?.skipped || [];
    info.innerHTML = skipped.length > 0 ? `<div class="skipped-list">⚠️ Blocos pulados: <span>${skipped.join(', ')}</span></div>` : '';
  } else {
    const total = day.tracks.length;
    const done = day.tracks.filter((_, ti) => completedTracks[trackKey(currentDayIndex, ti)]).length;
    if (done > 0) { btn.classList.add('show'); btn.classList.remove('finished'); btn.textContent = `⏭️ Finalizar Treino (${done}/${total} tracks)`; btn.disabled = false; info.innerHTML = ''; }
    else { btn.classList.remove('show'); info.innerHTML = ''; }
  }
}

/* ─── Cargas por track (Regra 17) ─── */
function loadLoads() { try { return JSON.parse(localStorage.getItem(LOAD_KEY) || '{}'); } catch { return {}; } }
function saveLoad(input) { const loads = loadLoads(); const k = input.dataset.loadKey; input.value.trim() ? loads[k] = input.value.trim() : delete loads[k]; localStorage.setItem(LOAD_KEY, JSON.stringify(loads)); }

/* ─── Timer de sessão ─── */
let timerInterval = null;
let sessionStartTime = null;
function loadTimerState() { try { return JSON.parse(localStorage.getItem(TIMER_KEY) || 'null'); } catch { return null; } }
function saveTimerState(s) { if (s) localStorage.setItem(TIMER_KEY, JSON.stringify(s)); else localStorage.removeItem(TIMER_KEY); }
function loadHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { return []; } }
function saveHistory(h) { localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); }
function formatTimer(ms) { const s = Math.floor(ms / 1000); const m = Math.floor(s / 60); return (m < 10 ? '0' : '') + m + ':' + ((s % 60) < 10 ? '0' : '') + (s % 60); }
function formatDuration(ms) { const t = Math.floor(ms / 60000); if (t < 60) return t + 'min'; return Math.floor(t / 60) + 'h' + (t % 60 > 0 ? (t % 60) + 'min' : ''); }

function startSession() {
  sessionStartTime = Date.now();
  saveTimerState({ start: sessionStartTime, dayIndex: currentDayIndex });
  document.getElementById('startBtn').classList.add('hidden');
  document.getElementById('timerBar').classList.add('active');
  document.getElementById('stopBtn').classList.remove('hidden');
  timerInterval = setInterval(updateTimer, 1000);
  updateTimer();
}
function updateTimer() { if (!sessionStartTime) return; document.getElementById('timerDisplay').textContent = formatTimer(Date.now() - sessionStartTime); }

function stopSession() {
  if (!sessionStartTime) return;
  const elapsed = Date.now() - sessionStartTime;
  clearInterval(timerInterval);
  const day = WEEK[currentDayIndex];
  let total = 0, done = 0;
  if (day && day.tracks) { day.tracks.forEach((_, ti) => { total++; if (completedTracks[trackKey(currentDayIndex, ti)]) done++; }); }
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  const history = loadHistory();
  history.push({ date: new Date().toISOString(), dayIndex: currentDayIndex, dayLabel: day ? day.label : '', dayName: day ? day.day : '', duration: elapsed, completionPct: pct, weekKey: getWeekKey() });
  saveHistory(history.filter(h => new Date(h.date).getTime() > Date.now() - 90 * 864e5));
  sessionStartTime = null;
  saveTimerState(null);
  document.getElementById('startBtn').classList.remove('hidden');
  document.getElementById('timerBar').classList.remove('active');
  document.getElementById('stopBtn').classList.add('hidden');
  document.getElementById('timerDisplay').textContent = '00:00';

  try { fetch('https://discord.com/api/webhooks/1524429182736662578/Qj6goPvSE29dijyZb1umcD-7FUXP4zouakk8A_gYTFPhqpqJZh_UwFaxK8xJUmAAKFQ0', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content: '✅ **' + ATHLETE + '** finalizou treino!\n📅 ' + new Date().toLocaleDateString('pt-BR') + ' (' + (day ? day.day : '') + ') — ' + (day ? day.label : '') + '\n⏱️ Tempo: ' + formatDuration(elapsed) + '\n📊 Blocos: ' + pct + '% (' + done + '/' + total + ')', username: 'Frequência — ' + ATHLETE, embeds: [{ fields: [
      { name: 'studentSlug', value: SLUG, inline: true },
      { name: 'perfil', value: '3-misto', inline: true },
      { name: 'loads', value: JSON.stringify(loadLoads()).slice(0, 1000), inline: false },
    ] }] }) }).catch(function(){}); } catch (e) {}

  alert('Treino finalizado!\nTempo: ' + formatDuration(elapsed) + '\nBlocos: ' + pct + '% concluídos');
}

function restoreTimer() {
  const state = loadTimerState();
  if (state && state.start) {
    if (Date.now() - state.start < 3 * 36e5) {
      sessionStartTime = state.start;
      document.getElementById('startBtn').classList.add('hidden');
      document.getElementById('timerBar').classList.add('active');
      document.getElementById('stopBtn').classList.remove('hidden');
      timerInterval = setInterval(updateTimer, 1000);
      updateTimer();
    } else { saveTimerState(null); }
  }
}

// ─── Dias flexíveis (06/10/2026): trocar o treino do dia, treinar num dia de descanso, adiar pra amanhã. Vale só pra semana atual. ───
(function(){
  const OV_KEY = DAY_CONFIG_KEY + '-ov-' + getWeekKey();
  function loadOv() { try { return JSON.parse(localStorage.getItem(OV_KEY) || '{}'); } catch { return {}; } }
  function saveOv(o) { localStorage.setItem(OV_KEY, JSON.stringify(o)); }
  // treinos disponíveis: TRAINING_SLOTS (páginas com engrenagem) ou os blocos únicos de WEEK_PLAN (páginas de semana fixa)
  const SLOTS = (typeof TRAINING_SLOTS !== 'undefined') ? TRAINING_SLOTS
    : WEEK_PLAN.filter(x => !x.rest).filter((x, i, a) => a.findIndex(y => y.label === x.label) === i).map(x => ({ label: x.label, blocks: x.blocks }));
  const basePattern = buildSchedule;              // padrão da engrenagem
  buildSchedule = function() {
    const base = basePattern(); const ov = loadOv();
    return base.map(d => {
      if (!(d.dayName in ov)) return d;
      const v = ov[d.dayName];
      if (v === 'rest') return { dayName: d.dayName, rest: true, label: 'Descanso', moved: true };
      const slot = SLOTS[v]; if (!slot) return d;
      return { dayName: d.dayName, rest: false, label: slot.label, blocks: slot.blocks, moved: true };
    });
  };
  function slotIndexOf(day) { return day.rest ? null : SLOTS.findIndex(s => s.label === day.label); }
  function rebuild() { WEEK_SCHEDULE = buildSchedule(); WEEK = buildWeek(); render(); }
  window.setDayOverride = function(di, value) {
    const ov = loadOv(); const name = WEEK[di].day;
    if (value === 'default') delete ov[name]; else ov[name] = value === 'rest' ? 'rest' : Number(value);
    saveOv(ov); rebuild();
  };
  window.postponeDay = function(di) {
    const names = WEEK.map(d => d.day);
    const slots = []; for (let j = di; j < WEEK.length; j++) { const s = slotIndexOf(WEEK[j]); if (s !== null) slots.push(s); }
    if (!slots.length) return;
    const room = WEEK.length - (di + 1);
    if (slots.length > room && !confirm('Não cabe tudo até sábado: o último treino da semana ficaria de fora. Adiar mesmo assim?')) return;
    const ov = loadOv();
    ov[names[di]] = 'rest';
    for (let j = di + 1, k = 0; j < WEEK.length; j++, k++) ov[names[j]] = k < slots.length ? slots[k] : 'rest';
    saveOv(ov); rebuild();
  };
  window.resetWeekOverrides = function() { localStorage.removeItem(OV_KEY); rebuild(); };
  // dia de descanso também abre
  selectDay = function(i) { currentDayIndex = i; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  const baseSwitcher = renderDaySwitcher;
  renderDaySwitcher = function() {
    baseSwitcher();
    document.querySelectorAll('#daySwitcher .day-btn').forEach((b, i) => { b.disabled = false; if (WEEK[i] && WEEK[i].moved) b.classList.add('moved'); });
  };
  const baseWorkout = renderWorkout;
  renderWorkout = function() {
    baseWorkout();
    const day = WEEK[currentDayIndex]; const content = document.getElementById('workoutContent'); if (!content) return;
    const cur = slotIndexOf(day); const hasOv = Object.keys(loadOv()).length > 0;
    const opts = SLOTS.map((s, k) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${s.label}</option>`).join('');
    const today = new Date().toISOString().split('T')[0]; const isPast = day.date < today;
    let html;
    if (day.rest) {
      html = `<div class="day-actions"><select onchange="if(this.value!=='')setDayOverride(${currentDayIndex}, this.value)"><option value="">Treinar neste dia? Escolha o treino…</option>${opts}</select>${hasOv ? '<button onclick="resetWeekOverrides()">Voltar ao padrão da semana</button>' : ''}</div>`;
      const box = content.querySelector('.rest-message'); if (box) box.insertAdjacentHTML('beforeend', html); else content.insertAdjacentHTML('afterbegin', html);
    } else {
      html = `<div class="day-actions"><select onchange="setDayOverride(${currentDayIndex}, this.value)">${opts}<option value="rest">Descansar neste dia</option></select>` +
        (currentDayIndex < WEEK.length - 1 ? `<button onclick="postponeDay(${currentDayIndex})" title="Empurra este treino e os seguintes um dia pra frente">Adiar pra amanhã →</button>` : '') +
        (hasOv ? '<button onclick="resetWeekOverrides()">Voltar ao padrão</button>' : '') +
        `<span class="hint">${isPast ? 'Perdeu este dia? ' : ''}Troca só esta semana. ${typeof TRAINING_SLOTS !== 'undefined' ? 'Seus dias fixos são seg, qua e sex.' : ''}</span></div>`;
      content.insertAdjacentHTML('afterbegin', html);
    }
  };
  rebuild();
})();
